<mat-card>
  <mat-card-header class="header-with-button">
    <button mat-button class="gray-button" (click)="add()">
      <mat-icon>add</mat-icon> Ajouter une action
    </button>
    <div class="title-wrapper">
      <mat-card-title>Liste des actions</mat-card-title>
    </div>
  </mat-card-header>

  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- Date de début -->
      <ng-container matColumnDef="date_start">
        <th mat-header-cell *matHeaderCellDef>Début</th>
        <td mat-cell *matCellDef="let element">
          {{ element.date_start ? (element.date_start | date:'dd/MM/yyyy') : '-' }}
        </td>
      </ng-container>

      <!-- Type d'action -->
      <ng-container matColumnDef="label_action_type">
        <th mat-header-cell *matHeaderCellDef>Type d'action</th>
        <td mat-cell *matCellDef="let element">
          {{ element.label_action_type }}
        </td>
      </ng-container>

      <!-- Agent -->
      <ng-container matColumnDef="label_actor">
        <th mat-header-cell *matHeaderCellDef>Agent</th>
        <td mat-cell *matCellDef="let element">
          {{ element.label_actor }}
        </td>
      </ng-container>

      <!-- Actions (menu) -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button
            mat-icon-button
            class="actions-trigger-red"
            [matMenuTriggerFor]="menu"
            (click)="$event.stopPropagation()"
          >
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="onEdit(element)">
              <mat-icon>edit</mat-icon>
              <span>Modifier</span>
            </button>

            <button mat-menu-item (click)="onRowClick(element)">
              <mat-icon style="color: #FFA726;">visibility</mat-icon>
              <span>Détails</span>
            </button>

            <button mat-menu-item color="warn" (click)="onDelete(element)">
              <mat-icon color="warn">delete</mat-icon>
              <span class="text-red">Supprimer</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <!-- Lignes -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row
          *matRowDef="let row; columns: displayedColumns;"
          class="clickable-row"
          (click)="onRowClick(row)">
      </tr>
    </table>

    <mat-paginator
      *ngIf="enablePagination && dataSource.data.length > 0"
      [pageSize]="rowPerPage"
      [pageSizeOptions]="[5, 10, 25, 100]"
      showFirstLastButtons>
    </mat-paginator>

    <!-- Aucune donnée -->
    <div class="no-data" *ngIf="dataSource.data.length === 0">
      Aucune action enregistrée pour ce test.
    </div>
  </mat-card-content>
</mat-card>
