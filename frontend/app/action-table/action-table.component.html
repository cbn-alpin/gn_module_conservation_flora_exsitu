<mat-card>
  <mat-card-header class="header-with-button">
    <button mat-button class="gray-button" (click)="add()">
      <mat-icon>add</mat-icon> Ajouter une action
    </button>
    <div class="title-wrapper">
      <mat-card-title>Liste des actions</mat-card-title>
    </div>
  </mat-card-header>

  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- Date de début -->
      <ng-container matColumnDef="date_start">
        <th mat-header-cell *matHeaderCellDef>Début</th>
        <td mat-cell *matCellDef="let element">
          {{ element.date_start | date:'shortDate' }}
        </td>
      </ng-container>

      <!-- Type d'action -->
      <ng-container matColumnDef="label_action_type">
        <th mat-header-cell *matHeaderCellDef>Type d'action</th>
        <td mat-cell *matCellDef="let element">
          {{ element.label_action_type }}
        </td>
      </ng-container>

      <!-- Agent -->
      <ng-container matColumnDef="label_actor">
        <th mat-header-cell *matHeaderCellDef>Agent</th>
        <td mat-cell *matCellDef="let element">
          {{ element.label_actor }}
        </td>
      </ng-container>

      <!-- Actions (menu) -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="onEdit(element)">
              <mat-icon>edit</mat-icon>
              <span>Éditer</span>
            </button>
            <button mat-menu-item (click)="onDelete(element)">
              <mat-icon>delete</mat-icon>
              <span>Supprimer</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <!-- Lignes -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row
          *matRowDef="let row; columns: displayedColumns;"
          class="clickable-row"
          (click)="onRowClick(row)">
      </tr>
    </table>

    <!-- Aucune donnée -->
    <div class="no-data" *ngIf="dataSource.data.length === 0">
      Aucune action enregistrée pour ce test.
    </div>
  </mat-card-content>
</mat-card>
