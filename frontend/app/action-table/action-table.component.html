<mat-card>
  <mat-card-header class="header-with-button">
    <button mat-button class="gray-button" (click)="add()">
      <mat-icon>add</mat-icon> Ajouter une action
    </button>
  
    <div class="title-wrapper">
      <mat-card-title>Liste Actions</mat-card-title>
    </div>
  </mat-card-header>
  
  <mat-card-content>
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type d'action</th>
        <td mat-cell *matCellDef="let element">{{element.type}}</td>
      </ng-container>
      <ng-container matColumnDef="numSemence">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let element">{{element.numSemence}}</td>
      </ng-container>
      <ng-container matColumnDef="dateDebut">
        <th mat-header-cell *matHeaderCellDef>Date début</th>
        <td mat-cell *matCellDef="let element">{{element.dateDebut | date}}</td>
      </ng-container>
      <ng-container matColumnDef="dateFin">
        <th mat-header-cell *matHeaderCellDef>Date fin</th>
        <td mat-cell *matCellDef="let element">{{element.dateFin | date}}</td>
      </ng-container>
      <ng-container matColumnDef="replicate">
        <th mat-header-cell *matHeaderCellDef>Réplicats</th>
        <td mat-cell *matCellDef="let element">{{element.replicate}}</td>
      </ng-container>
      <ng-container matColumnDef="levage">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon> 
          </button>
      
          <mat-menu #menu="matMenu">
            <button mat-menu-item class="view-btn" (click)="onView(element)">
              <mat-icon>visibility</mat-icon>
              <span>Voir</span>
            </button>
            <button mat-menu-item class="edit-btn" (click)="onEdit(element)">
              <mat-icon>edit</mat-icon>
              <span>Éditer</span>
            </button>
            <button mat-menu-item class="delete-btn"  (click)="onDelete(element)">
              <mat-icon>delete</mat-icon>
              <span>Supprimer</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>
      

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="clickable-row" (click)="onRowClick(row)"></tr>

    </table>
    <div class="no-data " *ngIf="dataSource.data.length === 0">
      Aucun test de germination enregistré
    </div>
  </mat-card-content>
</mat-card>
