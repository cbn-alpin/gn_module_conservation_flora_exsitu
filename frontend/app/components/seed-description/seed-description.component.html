<div mat-dialog-title>
  <h3 *ngIf="!edit">Ajout description</h3>
  <h3 *ngIf="edit">Modification description</h3>
</div>
<mat-dialog-content class="wrapper" *ngIf="seedForm">
  <div class="row row-0 mr-3 mt-2">
      <div class="col padding-sm">
        <label>Longueur moyenne(mm)</label>
        <input
          class="form-control"
          type="number"
          [formControl]="seedForm.controls.length"
        />
      </div>
      <div class="col-6 padding-sm">
        <label>Largeur moyenne(mm)</label>
        <input
          class="form-control"
          type="number"
          [formControl]="seedForm.controls.width"
        />
      </div>
  </div>

  <div class="row row-0 mr-3 mt-2">
      <div class="col padding-sm">
        <label>Épaisseur moyenne(mm)</label>
        <input
          class="form-control"
          type="number"
          [formControl]="seedForm.controls.thickness"
        />
      </div>
      <div class="col-6 padding-sm">
        <label>État du lot</label>
        <pnx-nomenclature
                keyValue="id_nomenclature"
                [bindAllItem]="false"
                keyLabel="label_default"
                codeNomenclatureType="CFE_MATERIAL_QUALITY"
                [parentFormControl]="seedForm.controls.id_material_quality"
              >
        </pnx-nomenclature>
      </div>
  </div>

  <div class="row row-0 mr-3 mt-2">
    <div class="col-6 padding-sm">
        <label>Masse totale(g)</label>
        <input
          class="form-control"
          type="number"
          [formControl]="seedForm.controls.total_mass"
        />
      </div>
      <div class="col-6 padding-sm">
        <label>Masse des graines échantillonnées(g)</label>
        <input
          class="form-control"
          type="number"
          [formControl]="seedForm.controls.sample_mass"
        />
    </div>
  </div>
  <div class="row row-0 mr-3 mt-2">
    <div class="col-6 padding-sm">
      <label>Nombre de graines échantillonnées</label>
      <input
        class="form-control"
        type="number"
        [formControl]="seedForm.controls.sample_count"
      />
    </div>
    <div class="col-6 padding-sm">
      <label>Nombre total de graines calculé</label>
      <input
        class="form-control"
        type="number"
        [formControl]="seedForm.controls.total_count"
        readonly
      />
    </div>
  </div>
  <div class="row row-0 mt-4">
    <div class="col-6 padding-sm">
      <section class="check-section">
          <mat-checkbox [formControl]="seedForm.controls.has_photo">
              Photo
          </mat-checkbox>
        </section>
    </div>
  </div>

  <div class="row row-0 mt-2 mr-3" *ngIf="seedForm.get('has_photo')?.value">
    <div class="col-6 padding-sm">
      <label> Type de média</label>
      <pnx-nomenclature
          keyValue="id_nomenclature"
          [bindAllItem]="false"
          keyLabel="label_default"
          codeNomenclatureType="TYPE_MEDIA"
          [parentFormControl]="seedForm.controls.id_media_type"
        >
      </pnx-nomenclature>
    </div>
    <div class="col-6 padding-sm" *ngIf="showPhotoField">
      <label for="photoInput">Fichier image</label>
      <input 
        type="file"
        id="photoInput"
        (change)="onMultipleFilesSelected($event)"
        accept="image/*"
        class="form-control"
        multiple
      />
    </div>
  
    <div class="col-6 padding-sm" *ngIf="showURLField">
      <div style="display: flex; justify-content: space-between;align-items: center;">
        <label>URL du média</label>
        <button mat-button color="primary" (click)="addUrlField()">Ajouter une URL</button>  
      </div>
      <div *ngFor="let control of mediaUrlControls.controls; let i = index" style="display: flex;">
        <input
          type="text"
          class="form-control"
          [formControl]="control"
          placeholder="URL du média"
        />
        <button mat-icon-button color="warn" (click)="removeUrlField(i)">
          <mat-icon>remove_circle</mat-icon>
        </button>
      </div>    
    </div>
  </div>

  <div class="row row-0 mt-3 mr-3">
    <div class="col padding-sm">
      <textarea
          class="form-control form-control-sm"
          placeholder="Remarques générales sur la semence"
          [formControl]="seedForm.controls.remarks"
        ></textarea>
    </div>
  </div>
  <mat-card appearance="outlined" class="mt-3" *ngIf="formsDefinition?.length">
    <mat-card-header>
      <mat-card-title>Données supplémentaires</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="row row-0">
        <div class="form-group col-6">
          <pnx-dynamic-form-generator
            [myFormGroup]="additionalDataForm"
            [formsDefinition]="formsDefinition"
            [autoGenerated]="true"
          ></pnx-dynamic-form-generator>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>
<mat-dialog-actions style="display: flex; justify-content: space-between; align-items: center;" class="ml-3 mr-4">
  <div>
    <button *ngIf="edit"
        color="warn"
        mat-raised-button
        (click)="deleteDescription()"
        matTooltip="Supprimer cette description">
          Supprimer
          <mat-icon style="vertical-align: middle">delete</mat-icon>
    </button>
  </div>
  <div>
    <ng-container *ngIf="!edit; else modifButton">
        <button
            style="margin-right: 20px"
            color="warn"
            mat-raised-button
            (click)="close()"
          >
            Retour
        </button>
      <button
        mat-button [mat-dialog-close]="true"
        matTooltip="Enregistrer ce matériel"
        class="button-success"
        (click)="submetData()"
        [disabled]="!seedForm.valid"
      >
        Enregistrer
        <mat-icon style="vertical-align: middle">save</mat-icon>
      </button>
    </ng-container>
    <ng-template #modifButton>
      <button
        style="margin-right: 20px"
        color="warn"
        mat-raised-button
        (click)="close()"
      >
        Annuler
      </button>
      <button
        class="button-success uppercase"
        mat-button [mat-dialog-close]="true"
        matTooltip="Modifier et enregistrer ce description"
        (click)="submetData()"
        [disabled]="!seedForm.valid"
      >
        Enregistrer
        <mat-icon style="vertical-align: middle">save</mat-icon>
      </button>
    </ng-template>
  </div>
</mat-dialog-actions>
