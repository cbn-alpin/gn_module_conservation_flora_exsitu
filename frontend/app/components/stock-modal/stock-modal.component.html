
<h1 mat-dialog-title *ngIf="!edit">Ajouter un stockage</h1>
<h1 mat-dialog-title *ngIf="edit">Modifier le stockage</h1>
<mat-dialog-content class="wrapper" *ngIf="stockForm">
  <div class="row row-0 mr-3 mt-2">
      <div class="col padding-sm">
        <small> Lieu de stockage *</small>
        <pnx-nomenclature
                keyValue="id_nomenclature"
                [bindAllItem]="false"
                codeNomenclatureType="CFE_PLACE"
                [parentFormControl]="stockForm.controls.id_place"
          >
       </pnx-nomenclature>
      </div>
      <div class="col-6 padding-sm">
        <small>Type de séchage</small>
        <pnx-nomenclature
                keyValue="id_nomenclature"
                [bindAllItem]="false"
                codeNomenclatureType="CFE_PLACE"
                [parentFormControl]="stockForm.controls.id_dry_type"
          >
       </pnx-nomenclature>
      </div>
  </div>

  <div class="row row-0 mr-3 mt-2">
      <div class="col padding-sm">
        <label>Quantité initiale</label>
        <input
          class="form-control"
          type="number"
          [formControl]="stockForm.controls.initial_quantity"
        />
      </div>
      <div class="col-6 padding-sm">
          <label>Quantité actuellement</label>
          <input
            class="form-control"
            type="number"
            [formControl]="stockForm.controls.current_quantity"
          />
      </div>
  </div>

  <div class="row row-0 mt-3 mr-3">
    <div class="col padding-sm">
      <textarea
          class="form-control form-control-sm"
          placeholder="Remarques générales"
          [formControl]="stockForm.controls.remarks"
        ></textarea>
    </div>
  </div>
</mat-dialog-content>
<mat-card appearance="outlined" class="mt-3" *ngIf="formsDefinition?.length">
  <mat-card-header>
    <mat-card-title>Données supplémentaires</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="row row-0">
      <div class="form-group col-6">
        <pnx-dynamic-form-generator
          [myFormGroup]="additionalDataForm"
          [formsDefinition]="formsDefinition"
          [autoGenerated]="true"
        ></pnx-dynamic-form-generator>
      </div>
    </div>
  </mat-card-content>
</mat-card>
<mat-dialog-actions style="display: flex; justify-content: space-between; align-items: center;" class="ml-3 mr-4">
  <div>
    <button *ngIf="edit"
        color="warn"
        mat-raised-button
        (click)="deleteDescription()"
        matTooltip="Supprimer cette description">
          Supprimer la description
          <mat-icon style="vertical-align: middle">delete</mat-icon>
    </button>
  </div>
  <div>
    <ng-container *ngIf="!edit; else modifButton">
        <button
            style="margin-right: 20px"
            color="warn"
            mat-raised-button
            (click)="close()"
          >
            Retour
        </button>
      <button
        mat-button [mat-dialog-close]="true"
        matTooltip="Enregistrer ce matériel"
        class="button-success"
        (click)="submetData()"
        [disabled]="!stockForm.valid"
      >
        Ajouter la description
        <mat-icon style="vertical-align: middle">save</mat-icon>
      </button>
    </ng-container>
    <ng-template #modifButton>
      <button
        style="margin-right: 20px"
        color="warn"
        mat-raised-button
        (click)="close()"
      >
        Annuler
      </button>
      <button
        class="button-success uppercase"
        mat-button [mat-dialog-close]="true"
        matTooltip="Modifier et enregistrer ce description"
        (click)="submetData()"
        [disabled]="!stockForm.valid"
      >
        Modifier cette description
        <mat-icon style="vertical-align: middle">save</mat-icon>
      </button>
    </ng-template>
  </div>
</mat-dialog-actions>
