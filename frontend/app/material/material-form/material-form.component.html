<div class="wrapper">
    
    <!-- <div class="row row-0"> -->
        <!-- <div class="col-xl-6 col-lg-7 col-sm-6"> -->
          <div class="row row-0 mr-3 mt-2">
              <div class="col padding-sm">
                <label>Code matériel</label>
                <input
                  class="form-control"
                  type="text"
                  [formControl]="materialForm.controls.code_material"
                />
              </div>
              <div class="col-6 padding-sm">
                  <label>Code parent</label>
                <input
                  class="form-control"
                  type="text"
                  [formControl]="materialForm.controls.code_parent"
                />
              </div>
          </div>

          <div class="row row-0 mr-3 mt-2">
              <div class="col padding-sm">
                  <label> Matériel végétal récolté</label>
                  <pnx-nomenclature
                          keyValue="id_nomenclature"
                          [bindAllItem]="true"
                          keyLabel="label_default"
                          codeNomenclatureType="CFE_HARVEST_MATERIAL"
                          [parentFormControl]="materialForm.controls.id_harvest_material"
                        >
                  </pnx-nomenclature>
              </div>
              <div class="col-6 padding-sm">
                  <label> Classes d’individus</label>
                  <pnx-nomenclature
                          keyValue="id_nomenclature"
                          [bindAllItem]="true"
                          keyLabel="label_default"
                          codeNomenclatureType="CFE_FOOT_COUNTING_CLASS"
                          [parentFormControl]="materialForm.controls.id_foot_counting_class"
                        >
                  </pnx-nomenclature>
              </div>
          </div>

          <div class="row row-0 mr-3">
              <div class="col padding-sm">
                  <label> Phénologie 1</label>
                  <pnx-nomenclature
                          keyValue="id_nomenclature"
                          [bindAllItem]="true"
                          keyLabel="label_default"
                          codeNomenclatureType="CFE_PHENOLOGY"
                          [parentFormControl]="materialForm.controls.id_phenology_1"
                        >
                  </pnx-nomenclature>
              </div>
              <div class="col-6 padding-sm">
                  <label> Phénologie 2</label>
                  <pnx-nomenclature
                          keyValue="id_nomenclature"
                          [bindAllItem]="true"
                          keyLabel="label_default"
                          codeNomenclatureType="CFE_PHENOLOGY"
                          [parentFormControl]="materialForm.controls.id_phenology_2"
                        >
                  </pnx-nomenclature>
              </div>
          </div>

          <div class="row row-0 mt-3 mr-3">
              <div class="col-6 padding-sm">
                  <textarea
                    class="form-control form-control-sm"
                    placeholder="Protocoles et astuces"
                    [formControl]="materialForm.controls.protocole_note"
                  ></textarea>
              </div>
              <div class="col-6 padding-sm">
                <textarea
                    class="form-control form-control-sm"
                    placeholder="Commentaire"
                    [formControl]="materialForm.controls.comment"
                ></textarea>
              </div>
          </div>

          <div class="row row-0 mr-3 mt-2">
              <div class="col padding-sm">
                <label>N° Banque culturale</label>
                <input
                  class="form-control"
                  type="number"
                  [formControl]="materialForm.controls.code_cultural_bank"
                />
              </div>
              <div class="col-6 padding-sm">
                  <label>Nombre de pieds échantillonnés</label>
                <input
                  class="form-control"
                  type="number"
                  [formControl]="materialForm.controls.sample_foot_nb"
                />
              </div>
          </div>

          <div class="row row-0 mr-3 mt-2">
              <div class="col padding-sm">
                  <label> Mode d’échantillonnage</label>
                  <pnx-nomenclature
                          keyValue="id_nomenclature"
                          [bindAllItem]="true"
                          keyLabel="label_default"
                          codeNomenclatureType="CFE_METHOD_SAMPLE"
                          [parentFormControl]="materialForm.controls.id_method_sample"
                        >
                  </pnx-nomenclature>
              </div>
              <div class="col-6 padding-sm">
                  
              </div>
          </div>
          <div class="row row-0 mr-3 mt-2">
            <div class="col-6 padding-sm">
              <section class="check-section">
                  <mat-checkbox
                      [formControl]="materialForm.controls.is_soil_sampling">
                      Prélèvement de terre
                  </mat-checkbox>
              </section>
            </div>
            <div class="col-6 padding-sm">
                  
            </div>
          </div>


          <div class="bloc-button">
            <ng-container *ngIf="!(materialFormService.occurrence | async); else modifButton">
              <button
                id="add-occ"
                data-qa="occurrence-add-btn"
                mat-raised-button
                class="button-success uppercase"
                matTooltip="Enregistrer ce matériel"
                (click)="submetData()"
              >
                Ajouter ce material
                <mat-icon style="vertical-align: middle">save</mat-icon>
              </button>
            </ng-container>
            <ng-template #modifButton>
              <button
                class="uppercase"
                style="margin-right: 20px"
                color="warn"
                mat-raised-button
                (click)="resetOccurrenceForm()"
                matTooltip="Annuler les modifications sur ce matériel"
              >
                Annuler
              </button>
              <button
                id="add-occ"
                class="button-success uppercase"
                mat-raised-button
                matTooltip="Modifier et enregistrer ce matériel"
              >
                Modifier ce matériel
                <mat-icon style="vertical-align: middle">save</mat-icon>
              </button>
            </ng-template>
          </div>
          

          <!-- <div class="mt-3 mb-5">
            <button (click)="submetData()" mat-raised-button class="button-success uppercase">
              <i class="fa fa-plus-circle" aria-hidden="true"> </i>
              Ajouter ce material</button>
          </div> -->
        
      <!-- </div> -->


      <!-- <div class="col-xl-4 col-lg-5 col-sm-6">
          
      </div> -->
    <!-- </div>     -->
</div>
