<button mat-raised-button class="button-success uppercase" (click)="addModalMaterial()">Ajouter matériel</button>
<div id="matlist-container" class="card mt-2">
  <div class="mt-2" 
    #dataTableContainer
  >
    <table mat-table [dataSource]="dataSource" class="mat-table">
      <!-- N° de Récolte -->
      <ng-container matColumnDef="code_material">
        <th mat-header-cell *matHeaderCellDef > N° récolte </th>
        <td mat-cell *matCellDef="let element"> {{ element.code_material }} </td>
      </ng-container>
      <!-- Matériel végétal -->
      <ng-container matColumnDef="harvest_material">
        <th mat-header-cell *matHeaderCellDef> Matériel végétal </th>
        <td mat-cell *matCellDef="let element"> {{ element.harvest_material_label }} </td>
      </ng-container>
      <!-- Taxons -->
      <ng-container matColumnDef="taxons">
        <th mat-header-cell *matHeaderCellDef> Taxons </th>
        <td mat-cell *matCellDef="let element" matTooltip="{{ element.taxonsTooltip }}"> 
          {{ element.taxonsDisplay }} 
        </td>
      </ng-container>
      <!-- N° de Récolte parent -->
      <ng-container matColumnDef="code_material_parent">
        <th mat-header-cell *matHeaderCellDef > N° récolte parent </th>
        <td mat-cell *matCellDef="let element"> {{ element.code_parent }} </td>
      </ng-container>
      <!-- N° de banque -->
      <ng-container matColumnDef="code_cultural_bank">
        <th mat-header-cell *matHeaderCellDef > N° banque culturale</th>
        <td mat-cell *matCellDef="let element"> {{ element.code_cultural_bank }} </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item
              (click)="editOccurrence(element)"
            >
              <mat-icon>edit</mat-icon>
              <span>Modifier</span>
            </button>
            <button mat-menu-item 
              [disabled]="element.has_seed_description || element.has_storage"
              (click)="deleteOccurrence(element)"
            >
              <mat-icon color="warn">delete</mat-icon>
              <span>Supprimer</span>
            </button>
            <button mat-menu-item
              *ngIf="constants.SEED_DESCRIPTION_CODES.includes(element.harvest_material_code) && element.taxons && element.taxons.length > 0"
              (click)="onAddOrEditSeed(element.id_material)"
            >
              <mat-icon
                [ngStyle]="{
                  color: element.has_seed_description ? 'green' : '#FFA726'
                }"
              >description</mat-icon>
              <span>Description</span>
            </button>
            <button mat-menu-item 
              *ngIf="element.has_seed_description"
              (click)="goToSeedDetails(element)"
            >
              <mat-icon>info</mat-icon>
              <span>Détails semence</span>
            </button>
            <button mat-menu-item 
              *ngIf="constants.STORABLE_MATERIAL_CODES.includes(element.harvest_material_code)"
              (click)="goToStock(element)"
            >
              <mat-icon>store</mat-icon>
              <span>Stocker</span>
            </button>
            <button
              mat-menu-item
              class="culture-action"
              (click)="goToCulture(element)"
            >
              <mat-icon>local_florist</mat-icon>
              <span>Culture</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; let i = index; columns: displayedColumns;"
      [ngClass]="{ 'highlighted': row.id_material === exsituFormService.idMaterial }"
      ></tr>
    </table>
    <mat-paginator
          [length]="totalMaterials"
          [pageSize]="rowPerPage"    
          [pageSizeOptions]="[5, 10, 25, 100]"  
          [showFirstLastButtons]="true" 
          (page)="onPaginateChange()"
        ></mat-paginator>
  </div>
</div>
