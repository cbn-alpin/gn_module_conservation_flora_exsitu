<h2>Liste des matériels</h2>
<div id="matlist-container">
  <div class="mt-2" 
    #dataTableContainer
  >
    <table mat-table [dataSource]="dataSource" class="mat-table">
      <!-- N° de Récolte -->
      <ng-container matColumnDef="code_material">
        <th mat-header-cell *matHeaderCellDef > N° réc </th>
        <td mat-cell *matCellDef="let element"> {{ element.code_material }} </td>
      </ng-container>
      <!-- Matériel végétal -->
      <ng-container matColumnDef="harvest_material">
        <th mat-header-cell *matHeaderCellDef> Matériel végétal </th>
        <td mat-cell *matCellDef="let element"> {{ element.harvest_material_label }} </td>
      </ng-container>
      <!-- Matériel végétal -->
      <ng-container matColumnDef="taxons">
        <th mat-header-cell *matHeaderCellDef> Taxons </th>
        <td mat-cell *matCellDef="let element" matTooltip="{{ element.taxonsTooltip }}"> 
          {{ element.taxonsDisplay }} 
        </td>
      </ng-container>
      <!-- Boutons d'action (Fusionner les colonnes Info, Edit, Delete en une seule colonne) -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element">
          <button 
            mat-icon-button 
            aria-label="Edit" 
            matTooltip="Modifier le matériel"
            (click)="editOccurrence(element)"
          ><mat-icon>edit</mat-icon></button>
          <button 
            mat-icon-button 
            color="warn" 
            aria-label="Delete" 
            matTooltip="Supprimer le matériel"
            (click)="deleteOccurrence(element)"
          ><mat-icon>delete</mat-icon></button>
          <button 
            mat-icon-button 
            color="primary"
            matTooltip="Description des graines"
            *ngIf="constants.SEED_DESCRIPTION_CODES.includes(element.harvest_material_code) && element.taxons && element.taxons.length > 0"
            (click)="onAddOrEditSeed(element.id_material)"
          >
            <mat-icon>description</mat-icon>
          </button>
        </td>
      </ng-container>
      <!-- Lignes de l'en-tête et des données -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; let i = index; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator
          [length]="totalMaterials"
          [pageSize]="rowPerPage"    
          [pageSizeOptions]="[5, 10, 25, 100]"  
          [showFirstLastButtons]="true" 
          (page)="onPaginateChange()"
        ></mat-paginator>
  </div>
</div>
