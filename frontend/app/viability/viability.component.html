<div>
  <mat-card>
    <mat-card-header   class="sticky-header">
      <mat-card-title>Fiche de Viabilite</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="germinationForm" class="semis-form">
        <!-- General Info -->
         
        <h2 class="section-title">Informations générales</h2>
        <!-- Code + Test parent -->
        <div class="form-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Numéro de TV</mat-label>
            <input matInput formControlName="code" required>
          </mat-form-field>
          
        </div>


        <!-- Nombre de graines + Réplicats -->
        <div class="form-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Nombre de graines testées</mat-label>
            <input matInput type="number" formControlName="seed_initial_count">
          </mat-form-field>
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Nombre de réplicats</mat-label>
            <input matInput type="number" formControlName="replicate_count">
          </mat-form-field>
        </div>

     

        <!-- Acteur + Type de test -->
        <div class="form-row">
          <div class="form-group half-width">
            <small> Effectué par</small>
            <pnx-observers
              [bindAllItem]="true"
              [parentFormControl]="germinationForm.controls.id_actor"
              [codeList]="observers_list_code"
              matTooltipPosition="above"
              [multiSelect]="true"
            >
            </pnx-observers>
          </div>
        
        </div>


        <!-- Support + Substrat -->
        <div class="form-row">
          <div class="form-group half-width">
            <small>Support </small>
            <pnx-nomenclature
              keyValue="id_nomenclature"
              [bindAllItem]="false"
              codeNomenclatureType="CFE_TG_SUPPORT"
              [parentFormControl]="germinationForm.controls.id_support"
            ></pnx-nomenclature>
          </div>
          <div class="form-group half-width">
            <small>Substrat </small>
            <pnx-nomenclature
              keyValue="id_nomenclature"
              [bindAllItem]="false"
              codeNomenclatureType="CFE_TEST_SUBSTRATE"
              [parentFormControl]="germinationForm.controls.id_substrate"
            ></pnx-nomenclature>
          </div>
        </div>

        <!-- Programme + Remarques -->
        <div class="form-row">
          
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Remarques</mat-label>
            <textarea matInput formControlName="remarks" rows="2"></textarea>
          </mat-form-field>
          <div class="form-group col-6">
            <pnx-dynamic-form-generator
              [myFormGroup]="additionalDataForm"
              [formsDefinition]="formsDefinition"
              [autoGenerated]="true"
            ></pnx-dynamic-form-generator>
          </div>
        </div>


        <!-- Submit -->
        <div class="form-actions dual-buttons sticky-actions">
          <button mat-button class="cancel-button with-border" type="button" (click)="onCancel()">
            <mat-icon>close</mat-icon>
            Annuler
          </button>
        
          <button mat-button class="save-button with-border" type="submit" (click)="onSubmit()"
          [disabled]="germinationForm.invalid"

          >
            <mat-icon>save</mat-icon>
            Enregistrer
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>


</div>
