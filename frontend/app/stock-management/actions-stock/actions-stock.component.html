<div style="display: flex; justify-content: space-between; align-items: center;">
  <h3>{{ title }}</h3>
  <button 
        (click)="openActionModal()"
        mat-raised-button
        class="button-success uppercase">Ajouter une action</button>
</div>
<div class="card mt-2">
  <div class="table-container">
      <table mat-table [dataSource]="dataSource" class="mat-table">
        <ng-container matColumnDef="action_type">
            <th mat-header-cell *matHeaderCellDef> Type d'action </th>
            <td mat-cell *matCellDef="let element"> 
              {{ element.action_type_label }}
            </td>
        </ng-container>
        <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef> Quantité </th>
            <td mat-cell *matCellDef="let element"> 
              {{ element.quantity }}
            </td>
        </ng-container>
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef> Date </th>
          <td mat-cell *matCellDef="let element"> 
            {{ element.date_start }}
          </td>
        </ng-container>
        <ng-container matColumnDef="actor">
            <th mat-header-cell *matHeaderCellDef> Auteur de l'action</th>
            <td mat-cell *matCellDef="let element"> 
              {{ element.actor }}
            </td>
        </ng-container>
        <ng-container matColumnDef="destination">
            <th mat-header-cell *matHeaderCellDef> Destination </th>
            <td mat-cell *matCellDef= "let element"> 
              {{ element.destination }}
            </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item
                (click)="openActionModal(element)"
              >
                <mat-icon>edit</mat-icon>
                <span>Modifier</span>
              </button>
              <button mat-menu-item 
                (click)="confirmDeleteAction(element)"
              >
                <mat-icon color="warn">delete</mat-icon>
                <span>Supprimer</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>
        <!-- Lignes de l'en-tête et des données -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; let i = index; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator
          (page)="onPaginateChange()"
          [pageSize]="rowPerPage"
          [length]="totalActions"
      ></mat-paginator>
  </div>
</div>
