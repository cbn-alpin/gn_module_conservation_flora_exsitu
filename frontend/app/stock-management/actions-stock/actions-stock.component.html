<div class="stock-actions-header">

  <h3>
    {{ title }}
  </h3>

</div>

<div class="stock-actions-card mt-2">

  <div class="table-container">

    <ng-container
      *ngIf="
        dataSource.data.length > 0;
        else noStockActions
      "
    >

      <table
        mat-table
        [dataSource]="dataSource"
        class="stock-list-table"
      >
        <ng-container matColumnDef="action_type">
            <th mat-header-cell *matHeaderCellDef> Type d'action </th>
            <td mat-cell *matCellDef="let element"> 
              {{ element.action_type_label }}
            </td>
        </ng-container>
        <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef> Quantité </th>
            <td mat-cell *matCellDef="let element"> 
              {{ element.quantity }}
            </td>
        </ng-container>
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef> Date </th>
          <td mat-cell *matCellDef="let element"> 
            {{ element.date_start | date:'dd/MM/yyyy' }}
          </td>
        </ng-container>
        <ng-container matColumnDef="destination">
            <th mat-header-cell *matHeaderCellDef> Destination </th>
            <td mat-cell *matCellDef= "let element"> 
              {{ element.destination }}
            </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef aria-label="Actions"></th>
          <td mat-cell *matCellDef="let element">
            <button
              mat-icon-button
              class="actions-trigger-red"
              [matMenuTriggerFor]="menu"
              (menuOpened)="setActiveActionRow(element)"
              (menuClosed)="clearActiveActionRow()"
              aria-label="Actions"
            >
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item
                (click)="openActionModal(element)"
              >
                <mat-icon>edit</mat-icon>
                <span>Modifier</span>
              </button>

              <button mat-menu-item>
                <mat-icon style="color: #FFA726;">visibility</mat-icon>
                <span>Détails/Action</span>
              </button>

              <button mat-menu-item
                class="delete-action-red"
                (click)="confirmDeleteAction(element)"
              >
                <mat-icon>delete</mat-icon>
                <span>Supprimer</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>
              <!-- Lignes de l'en-tête et des données -->
      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      >
      </tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          let i = index;
          columns: displayedColumns;
        "
        [class.action-row-active]="isActionRowActive(row)"
      >
      </tr>

      </table>

      <mat-paginator
        class="stock-list-paginator"
        [pageSize]="rowPerPage"
        [pageSizeOptions]="[5, 10, 25, 100]"
        [length]="totalActions"
        (page)="onPaginateChange()"
        showFirstLastButtons
      >
      </mat-paginator>

    </ng-container>


    <ng-template #noStockActions>

      <mat-card class="stock-empty-card mt-4">

        <mat-icon color="warn">
          info
        </mat-icon>

        Aucune action enregistrée pour « {{ title }} ».

      </mat-card>

    </ng-template>

  </div>

</div>
