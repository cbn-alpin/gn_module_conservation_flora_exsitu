<!-- RETOUR VERS MATÉRIEL RÉCOLTÉ -->
<div class="stock-list-return-button">

  <button
    mat-raised-button
    type="button"
    (click)="onBackToMaterial()"
  >
    <mat-icon>arrow_back</mat-icon>

    Retour
  </button>

</div>

<mat-card class="stock-list-card">

  <div class="stock-list-hero">

    <div class="stock-list-hero-icon">
      <mat-icon>store</mat-icon>
    </div>

  </div>

  <mat-card-header class="stock-list-header">

    <button
      mat-button
      type="button"
      class="stock-list-add-button"
      (click)="openActionModal()"
    >
      <mat-icon>add</mat-icon>

      Ajouter une fiche de stockage
    </button>

    <div class="stock-title-wrapper">
      <mat-card-title>
        Fiche de Stockage
      </mat-card-title>
    </div>

  </mat-card-header>

  <mat-card-content class="stock-list-content">

    <div class="container-fluid">

      <div class="stock-summary-card">

        <div class="stock-summary-header">

          <div class="stock-summary-icon">
            <mat-icon>description</mat-icon>
          </div>

          <div class="stock-summary-text">

            <span class="stock-summary-title">
              Synthèse des quantités
            </span>

            <span class="stock-summary-subtitle">
              État global du matériel en stockage
            </span>

          </div>

        </div>

        <div class="stock-summary-quantities">

          <div class="stock-summary-quantity seed-quantity">

            <div class="stock-summary-quantity-header">
              Quantité initiale globale
            </div>

            <strong class="stock-summary-quantity-value">
              {{ totalInitialQuantity }}
            </strong>

            <small>
              Quantité issue de la fiche de Semence
            </small>

          </div>

          <div class="stock-summary-quantity current-stock-quantity">

            <div class="stock-summary-quantity-header">
              Quantité actuelle globale
            </div>

            <strong class="stock-summary-quantity-value">
              {{ totalCurrentQuantity }}
            </strong>

            <small>
              Quantité disponible après les mouvements de stockage
            </small>

          </div>

        </div>

      </div>

      <div class="row">

        <div class="col-md-6 col-12 mb-4">
          <cfe-actions-stock
            [title]="'Salle de pré-séchage'"
            [placeCode]="
              constants.PLACE_CODES.PRE_DRYING_ROOM
            "
          >
          </cfe-actions-stock>
        </div>

        <div class="col-md-6 col-12 mb-4">
          <cfe-actions-stock
            [title]="'Salle de séchage'"
            [placeCode]="
              constants.PLACE_CODES.DRYING_ROOM
            "
          >
          </cfe-actions-stock>
        </div>

        <div class="col-md-6 col-12 mb-4">
          <cfe-actions-stock
            [title]="'Chambre froide'"
            [placeCode]="
              constants.PLACE_CODES.COLD_ROOM
            "
          >
          </cfe-actions-stock>
        </div>

        <div class="col-md-6 col-12 mb-4">
          <cfe-actions-stock
            [title]="'Congélateur'"
            [placeCode]="
              constants.PLACE_CODES.FREEZER
            "
          >
          </cfe-actions-stock>
        </div>

      </div>

    </div>

  </mat-card-content>

</mat-card>
