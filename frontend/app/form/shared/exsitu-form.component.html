<div
  style="background-color: white;"
  [class.workflow-page-background]="
    exsituFormService.currentTab !== 'harvest'
  "
>
    <!-- Les onglets -->
    <div class="tab">
        <div class="tab-left">
            <!-- Récolte (Toujours activé) -->
            <a class="tablinks themed-tab harvest-tab"
                [class.active]="exsituFormService.currentTab === 'harvest'"
                (click)="goToTab('harvest')"
            >
                <mat-icon class="example-tab-icon">place</mat-icon>
                Récolte
            </a>

            <!-- Matériel récolté (Activé après ajout de la récolte) -->
            <a 
                class="tablinks themed-tab materials-tab"
                [class.disabled]="!exsituFormService.idHarvest"
                [ngClass]="{
                    active:
                        exsituFormService.currentTab === 'materials' ||
                        exsituFormService.currentTab === 'material-details'
                }"
                (click)="goToTab('materials')"
            >
                <mat-icon class="example-tab-icon">spa</mat-icon>
                Matériels récoltés
            </a>

            <!-- Semence (Activé uniquement pour une Graine avec au moins un taxon) -->
            <a 
                class="tablinks themed-tab seed-tab"
                [class.disabled]="
                    !exsituFormService.idMaterial ||
                    !constants.SEED_DESCRIPTION_CODES.includes(
                        exsituFormService.materialTypeCode
                    ) ||
                    !exsituFormService.materialHasTaxon
                "
                [ngClass]="{ active: exsituFormService.currentTab === 'seed' }"
                (click)="
                    exsituFormService.idMaterial &&
                    constants.SEED_DESCRIPTION_CODES.includes(
                        exsituFormService.materialTypeCode
                    ) &&
                    exsituFormService.materialHasTaxon
                        ? goToTab('seed')
                        : null
                ">
                <mat-icon class="example-tab-icon">description</mat-icon>
                Semence
            </a>

            <!-- Stockage (Activé après avoir choisi un matériel) -->
            <a 
                class="tablinks themed-tab stock-tab"
                [class.disabled]="!exsituFormService.idMaterial"
                [ngClass]="{
                    active:
                        exsituFormService.currentTab === 'stock' ||
                        exsituFormService.currentTab === 'stock-details'
                }"
                (click)="exsituFormService.idMaterial ? goToTab('stock') : null">
                <mat-icon class="example-tab-icon">store</mat-icon>
                Stockage
            </a>

            <!-- Test de germination -->
            <a 
                class="tablinks themed-tab germination-tab"
                [class.disabled]="!exsituFormService.idMaterial"
                [ngClass]="{
                    active:
                        exsituFormService.currentTab === 'germination-table' ||
                        exsituFormService.currentTab === 'germination-details'
                }"
                (click)="exsituFormService.idMaterial ? goToTab('germination-table') : null"
            >
                <mat-icon class="example-tab-icon">wb_sunny</mat-icon>
                Test de germination
            </a>
                 

            <!-- Semis -->
            <a
            class="tablinks"
            [class.disabled]="!exsituFormService.idMaterial"
            [ngClass]="{
                active:
                exsituFormService.currentTab === 'semis-table' ||
                exsituFormService.currentTab === 'semis-details'
            }"
            (click)="exsituFormService.idMaterial ? goToTab('semis-table') : null"
            >
            <mat-icon class="example-tab-icon">
                grain
            </mat-icon>

            Semis
            </a>


            
            <a class="tablinks themed-tab viability-tab"
                [class.disabled]="!exsituFormService.idMaterial"
                [ngClass]="{
                    active:
                        exsituFormService.currentTab === 'viability-table' ||
                        exsituFormService.currentTab === 'viability-details'
                }"
                (click)="exsituFormService.idMaterial ? goToTab('viability-table') : null">
                <mat-icon class="example-tab-icon">check_circle</mat-icon>
                Test de Viabilité
            </a>
            <!-- Culture -->

            <a
            class="tablinks culture-tab"
            [class.disabled]="
                !exsituFormService.idMaterial
            "
            [ngClass]="{
                active:
                exsituFormService.currentTab ===
                    'culture-table' ||
                exsituFormService.currentTab ===
                    'culture-details'
            }"
            (click)="
                exsituFormService.idMaterial
                ? goToTab('culture-table')
                : null
            "
            >

            <mat-icon
                class="example-tab-icon culture-tab-icon"
            >
                local_florist
            </mat-icon>

            Culture

            </a>
              
              
        </div>
    </div>


    <!-- =====================================================
         BARRE DE PROGRESSION DU WORKFLOW
         ===================================================== -->

<!-- =====================================================
     BARRE DE PROGRESSION DU WORKFLOW
     ===================================================== -->

<div
    class="workflow-progress"
    aria-hidden="true"
    [ngClass]="{
        'progress-harvest':
            exsituFormService.currentTab ===
            'harvest',

        'progress-materials':
            exsituFormService.currentTab ===
                'materials' ||
            exsituFormService.currentTab ===
                'material-details',

        'progress-seed':
            exsituFormService.currentTab ===
            'seed',

        'progress-stock':
            exsituFormService.currentTab ===
                'stock' ||
            exsituFormService.currentTab ===
                'stock-details',

        'progress-germination':
            exsituFormService.currentTab ===
                'germination-table' ||
            exsituFormService.currentTab ===
                'germination-add' ||
            exsituFormService.currentTab ===
                'germination-details',

        'progress-semis':
            exsituFormService.currentTab ===
                'semis-table' ||
            exsituFormService.currentTab ===
                'semis-add' ||
            exsituFormService.currentTab ===
                'semis-details',

        'progress-viability':
            exsituFormService.currentTab ===
                'viability-table' ||
            exsituFormService.currentTab ===
                'viability-add' ||
            exsituFormService.currentTab ===
                'viability-details',

        'progress-culture':
            exsituFormService.currentTab ===
                'culture-table' ||
            exsituFormService.currentTab ===
                'culture-details'
    }"
>

    <div class="workflow-progress-track">

        <!-- Récolte -->
        <div class="workflow-progress-slot">

            <span class="workflow-progress-measure">
                <span class="workflow-progress-icon-space">
                </span>

                Récolte
            </span>

            <span class="workflow-progress-segment">
            </span>

            <span class="workflow-progress-marker">
            </span>

        </div>


        <!-- Matériels récoltés -->
        <div class="workflow-progress-slot">

            <span class="workflow-progress-measure">
                <span class="workflow-progress-icon-space">
                </span>

                Matériels récoltés
            </span>

            <span class="workflow-progress-segment">
            </span>

            <span class="workflow-progress-marker">
            </span>

        </div>


        <!-- Semence -->
        <div class="workflow-progress-slot">

            <span class="workflow-progress-measure">
                <span class="workflow-progress-icon-space">
                </span>

                Semence
            </span>

            <span class="workflow-progress-segment">
            </span>

            <span class="workflow-progress-marker">
            </span>

        </div>


        <!-- Stockage -->
        <div class="workflow-progress-slot">

            <span class="workflow-progress-measure">
                <span class="workflow-progress-icon-space">
                </span>

                Stockage
            </span>

            <span class="workflow-progress-segment">
            </span>

            <span class="workflow-progress-marker">
            </span>

        </div>


        <!-- Test de germination -->
        <div class="workflow-progress-slot">

            <span class="workflow-progress-measure">
                <span class="workflow-progress-icon-space">
                </span>

                Test de germination
            </span>

            <span class="workflow-progress-segment">
            </span>

            <span class="workflow-progress-marker">
            </span>

        </div>


        <!-- Semis -->
        <div class="workflow-progress-slot">

            <span class="workflow-progress-measure">
                <span class="workflow-progress-icon-space">
                </span>

                Semis
            </span>

            <span class="workflow-progress-segment">
            </span>

            <span class="workflow-progress-marker">
            </span>

        </div>


        <!-- Test de Viabilité -->
        <div class="workflow-progress-slot">

            <span class="workflow-progress-measure">
                <span class="workflow-progress-icon-space">
                </span>

                Test de Viabilité
            </span>

            <span class="workflow-progress-segment">
            </span>

            <span class="workflow-progress-marker">
            </span>

        </div>


        <!-- Culture -->
        <div class="workflow-progress-slot">

            <span class="workflow-progress-measure">
                <span class="workflow-progress-icon-space">
                </span>

                Culture
            </span>

            <span class="workflow-progress-segment">
            </span>

            <span class="workflow-progress-marker">
            </span>

        </div>

    </div>

</div>



    <!-- Les header -->

    <div
    *ngIf="exsituFormService.currentTab !== 'harvest'"
    [class.mb-5]="
        exsituFormService.currentTab !== 'materials' &&
        exsituFormService.currentTab !== 'material-details' &&
        exsituFormService.currentTab !== 'seed' &&
        exsituFormService.currentTab !== 'culture-table' &&
        exsituFormService.currentTab !== 'culture-details' &&
        exsituFormService.currentTab !== 'semis-table' &&
        exsituFormService.currentTab !== 'semis-details' &&
        exsituFormService.currentTab !== 'germination-table' &&
        exsituFormService.currentTab !== 'germination-details' &&
        exsituFormService.currentTab !== 'viability-table' &&
        exsituFormService.currentTab !== 'viability-details' &&
        exsituFormService.currentTab !== 'stock' &&
        exsituFormService.currentTab !== 'stock-details'
    "
    >
        <cs-header></cs-header>
    </div>


    <!-- Les contents -->

    <div *ngIf="exsituFormService.currentTab === 'harvest'"
        [ngStyle]="{ 'min-height.px': cardContentHeight }"
    >
        <div class="row row-0">
            <div class="col-xl-6 col-lg-7 col-sm-6"
                [ngStyle]="{ 'height.px': cardContentHeight }"
            >
                <ex-harvest-map></ex-harvest-map>
            </div>
            <div class="col-xl-6 col-lg-7 col-sm-6">
                <ex-harvest-form></ex-harvest-form>
            </div>
        </div>
        
    </div>
