<mat-card appearance="outlined" class="mt-3">
  <mat-card-header>
    <mat-card-title>Quoi</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="row row-0">
      <div class="col-6 padding-sm">
        <div class="form-group">
          <small> Type de récolte *</small>
          <pnx-nomenclature
                  keyValue="id_nomenclature"
                  [bindAllItem]="false"
                  codeNomenclatureType="CFE_HARVEST_TYPE"
                  [parentFormControl]="harvestForm.controls.id_harvest_type"
                >
          </pnx-nomenclature>
        </div>
      </div>
      <div class="col-6">
        <div class="form-group">
          <pnx-autocomplete
              apiEndPoint="{{ habref_url }}"
              [searchAsParameter]="false"
              queryParamSearch="search_name"
              [parentFormControl]="harvestForm.controls.cd_hab"
              keyValue="search_name"
              [formatter]="formatter"
              label="Habitat"
              placeholder="Tapez les premières lettres..."
            ></pnx-autocomplete>
        </div>
      </div>
    </div>
    <div class="row row-0">
      <div class="col-6 padding-sm">
        <div class="form-group">
          <pnx-datasets
            label="Jeux de données *"
            [parentFormControl]="harvestForm.controls.id_dataset"
            moduleCode="CONSERVATION_FLORA_EXSITU"
            creatableInModule="CONSERVATION_FLORA_EXSITU"
          >
          </pnx-datasets>
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
<mat-card appearance="outlined" class="mt-3">
  <mat-card-header>
    <mat-card-title>Où</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="row row-0 mt-2">
      <div class="form-group col-6 padding-sm">
        <small> Précision géographique *</small>
        <pnx-nomenclature
                keyValue="id_nomenclature"
                [bindAllItem]="true"
                codeNomenclatureType="CFE_GEOGRAPHICAL_PRECISION"
                [parentFormControl]="harvestForm.controls.id_geographical_location"
              >
         </pnx-nomenclature>
      </div>
      <div class="form-group col-6" *ngIf="harvertFormService.showCommuneField">
        <pnx-areas
          label="Commune"
          [typeCodes]="['COM']"
          [parentFormControl]="harvestForm.controls.location_code_muni"
          >
        </pnx-areas>
      </div>
      <div class="form-group col-6" *ngIf="harvertFormService.showDepartmentField">
        <pnx-areas
          label="Département"
          [typeCodes]="['DEP']"
          [parentFormControl]="harvestForm.controls.location_code_dept"
          >
        </pnx-areas>
      </div>
      <div class="form-group col-6" *ngIf="harvertFormService.showResolutionField">
        <small>Résolution</small>
        <input
          class="form-control form-control-sm"
          type="number"
          [formControl]="harvestForm.controls.precision"
        />
      </div>
    </div>
    <div class="row row-0">
      <div class="form-group col-6 padding-sm">
        <small>Surface (en m²)</small>
        <input
          class="form-control form-control-sm"
          type="number"
          [formControl]="harvestForm.controls.surface"
        />
      </div>

      <div class="form-group col-6">
        <small>Altitude</small>
        <input
          class="form-control form-control-sm"
          type="number"
          [formControl]="harvestForm.controls.altitude"
        />
      </div>
    </div>
    <div class="row row-0 mt-3 mr-3">
      <div class="col padding-sm">
          <textarea
            class="form-control form-control-sm"
            placeholder="Complément localisation"
            [formControl]="harvestForm.controls.place_remarks"
          ></textarea>
      </div>
    </div>
    <mat-card appearance="outlined" class="mt-3">
      <mat-card-header>
        <mat-card-title>Informations sur la station</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="row row-0">
          <div class="col-6 padding-sm">
            <small>Exposition :</small>
            <pnx-nomenclature
                    keyValue="id_nomenclature"
                    [bindAllItem]="false"
                    codeNomenclatureType="EXPOSITION"
                    [parentFormControl]="harvestForm.controls.id_exposition"
                  >
            </pnx-nomenclature>
          </div>
          <div class="form-group col-6">
            <small>Pente</small>
            <input
              class="form-control form-control-sm"
              type="number"
              [formControl]="harvestForm.controls.slope"
            />
          </div>
        </div>
      </mat-card-content>
    </mat-card>    
  </mat-card-content>
</mat-card>
<mat-card appearance="outlined" class="mt-3">
  <mat-card-header>
    <mat-card-title>Quand</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="row row-0">
      <div class="col-4 padding-sm">
        <div class="form-group">
          <pnx-date
            [defaultToday]="true"
            label="Date début"
            [parentFormControl]="harvestForm.controls.date_start"
          ></pnx-date>
        </div>
      </div>
      <div class="col-4">
        <div class="form-group">
          <pnx-date
            label="Date fin"
            [parentFormControl]="harvestForm.controls.date_end"
          ></pnx-date>
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
<mat-card appearance="outlined" class="mt-3">
  <mat-card-header>
    <mat-card-title>Qui</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="col-8">
      <div class="form-group">
        <small> Observateur(s) * :</small>
        <pnx-observers
          [bindAllItem]="true"
          [parentFormControl]="harvestForm.controls.observers"
          [codeList]="observers_list_code"
          matTooltipPosition="above"
          [multiSelect]="true"
        >
        </pnx-observers>
      </div>
    </div>
  </mat-card-content>
</mat-card>

<div class="row row-0 mt-3">
  <div class="col padding-sm">
    <textarea
        class="form-control form-control-sm"
        placeholder="Remarques générales | Commentaire météo"
        [formControl]="harvestForm.controls.remarks"
      ></textarea>
  </div>
</div>

<mat-card appearance="outlined" class="mt-3" *ngIf="formsDefinition">
  <mat-card-header>
    <mat-card-title>Données supplémentaires</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="row row-0">
      <div class="form-group col-6">
        <pnx-dynamic-form-generator
          [myFormGroup]="additionalDataForm"
          [formsDefinition]="formsDefinition"
          [autoGenerated]="true"
        ></pnx-dynamic-form-generator>
      </div>
    </div>
  </mat-card-content>
</mat-card>

<div class="card-footer mr-3">
  <div class="row">
    <div class="col padding-sm">
      <button (click)="cancel()" type="button" class="btn btn-danger box-shadow">
        Retour
      </button>
    </div>
    <div *ngIf="!exsituFormService.editionMode['_value']">
      <button 
        (click)="onSubmit()" 
        type="button" 
        class="btn btn-success box-shadow" 
        [disabled]="!harvestForm.valid"
      >
          <i class="fa fa-save"> </i>
          Enregister et ajouter matériels
      </button>
    </div>
    <div *ngIf="exsituFormService.editionMode['_value']">
      <button 
        (click)="onSubmit()" 
        type="button" 
        class="btn btn-success box-shadow" 
        [disabled]="!harvestForm.valid"
      >
          <i class="fa fa-save"> </i>
          Modifier
      </button>
    </div>
  </div>
</div>
