<pnx-map
      height="100%"
      class="map-card"
      [geolocation]="true"
      [center]="center" 
      [zoom]="zoom"
      [class.map-disabled]="!showMap"
    >
      <pnx-marker
        [coordinates]="markerCoordinates"
        [zoomLevel]="1"
        [defaultEnable]="false"
        (markerChanged)="addGeoInfo($event)"
      ></pnx-marker>
      <pnx-leaflet-draw
        [geojson]="currentGeoJsonFileLayer"
        [options]="leafletDrawOptions"
        [zoomLevel]="1"
        (layerDrawed)="showMap ? addGeoInfo($event) : null"
        (layerDeleted)="showMap ? deleteGeoInfo() : null"
      ></pnx-leaflet-draw>
      <pnx-leaflet-filelayer
        (onGeomChange)="showMap ? addGeoInfo($event) : null"
        [editMode]="showMap"
        [style]="{ color: 'green' }"
      ></pnx-leaflet-filelayer>

      <pnx-gps></pnx-gps>

</pnx-map>
